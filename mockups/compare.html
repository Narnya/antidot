<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Welcome — сравнение</title>
    <style>
      body {
        margin: 0; background: #2b2b2b; color: #eee; padding: 20px;
        font-family: system-ui, sans-serif; display: flex; gap: 20px; align-items: flex-start;
      }
      .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
      .label { font-size: 13px; color: #bbb; }
      .frame { width: 390px; height: 844px; border: 1px solid #555; overflow: hidden; background: #000; border-radius: 20px; }
      img.ref { width: 390px; display: block; }
      iframe { width: 390px; height: 844px; border: 0; }
      .note { color: #999; font-size: 12px; max-width: 200px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="col">
      <div class="label">Твой макет — ref-welcome.png</div>
      <div class="frame"><img class="ref" src="ref-welcome.png" alt="положи ref-welcome.png в mockups/" /></div>
      <div class="note">Если пусто — положи файл mockups/ref-welcome.png и обнови страницу.</div>
    </div>
    <div class="col">
      <div class="label">Мой шаблон — welcome.html</div>
      <div class="frame"><iframe src="welcome.html" scrolling="no"></iframe></div>
    </div>
  </body>
</html>
